[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2video"
version = "0.4.0"
description = "Turn Zhihu content or public tech sources into vertical short videos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<16",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "edge-tts>=6.1,<8",
    "playwright>=1.47,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
mcp = ["mcp==1.28.1"]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
c2video = "c2video.cli.main:app"
c2video-mcp = "c2video.mcp_server.__main__:main"

[tool.setuptools.packages.find]
include = ["c2video*"]

[tool.setuptools.package-data]
c2video = ["pipeline/*.html", "prompts/*.md", "api/static/**/*", "evals/*.json", "fixtures/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]



